name: Build wheels

on:
  pull_request:
    branches: [ wheels ]
  push:
    branches: [ wheels ]

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # dynamically set MACOSX_DEPLOYMENT_TARGET on macOS runners
      - name: Set macOS deployment target dynamically
        if: runner.os == 'macOS'
        run: |
          MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          echo "Detected macOS major version: $MAJOR"
          echo "MACOSX_DEPLOYMENT_TARGET=${MAJOR}.0" >> $GITHUB_ENV

      # Windows: MinGW gfortran/gcc, with the Fortran and OpenMP runtimes linked
      # into the DLL (irmsd/_lib.py loads it as irmsd_fortran.dll or MinGW's
      # libirmsd_fortran.dll)
      - name: Set up Fortran compiler (Windows)
        if: runner.os == 'Windows'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0
        with:
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          # the OpenMP runtime (libgomp) into the wheel, as auditwheel and
          # delocate do on Linux and macOS; --analyze-existing since the DLL is
          # loaded with ctypes, not imported
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --analyze-existing -w {dest_dir} {wheel}
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_GENERATOR=Ninja CC=gcc FC=gfortran
            SKBUILD_CMAKE_DEFINE="IRMSD_REQUIRE_OPENMP=ON;CMAKE_SHARED_LIBRARY_PREFIX=;CMAKE_SHARED_LINKER_FLAGS=-static -static-libgcc -static-libgfortran"
          CIBW_BEFORE_ALL_MACOS: |
            brew install gcc
            GFORTRANS=$(ls "$(brew --prefix)"/bin/gfortran-[0-9]* 2>/dev/null || true)
            if [ -z "$GFORTRANS" ]; then
              echo "No gfortran-* binaries found in $(brew --prefix)/bin" >&2
              exit 1
            fi
            # Pick the highest version numerically by the suffix
            GFORTRAN_BIN=$(printf '%s\n' $GFORTRANS | sort -t- -k2,2n | tail -n1)
            echo "Using Fortran compiler: $GFORTRAN_BIN"
            ln -sf "$GFORTRAN_BIN" "$(brew --prefix)/bin/gfortran"
            which gfortran || { echo "gfortran still not on PATH"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

